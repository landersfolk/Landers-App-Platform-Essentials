apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notification-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/landersfolk/Landers-App-Platform-Essentials.git
    targetRevision: quality
    path: charts/landers-app
    helm:
      valueFiles:
        - ../../apps/notification-service/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    # Manual sync only on this cluster (live QA, real traffic) -- sync each
    # Application by hand (argocd app sync <name> or the UI) after reviewing
    # its diff, don't let ArgoCD auto-overwrite already-running pods.
    syncOptions:
      - CreateNamespace=false
