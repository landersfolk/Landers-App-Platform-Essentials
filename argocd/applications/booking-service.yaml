apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: booking-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/landersfolk/Landers-App-Platform-Essentials.git
    targetRevision: main
    path: charts/landers-app
    helm:
      valueFiles:
        - ../../apps/booking-service/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
