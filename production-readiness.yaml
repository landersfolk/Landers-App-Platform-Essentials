# Cluster-wide/namespace-wide policy objects added as part of a production-
# readiness pass (priority classes, resource governance for the `default`
# namespace — where every app service, Keycloak, Vault, Kafka, Redis, and the
# LGTM stack all currently run). Apply once per cluster:
#   kubectl apply -f production-readiness.yaml
#
# ResourceQuota below is sized against this cluster's real node capacity
# (QA EC2, confirmed live: 8 CPU / ~32Gi allocatable, single node) and
# current actual usage (~3.5 CPU / ~7.7Gi requested across every pod in
# `default` today) — leaves real headroom for growth and for kube-system,
# while still bounding a runaway/misconfigured deployment. Re-check node
# capacity before reusing this file as-is against a differently-sized
# cluster (e.g. a future prod environment).
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: critical-infra
value: 100000
globalDefault: false
description: >-
  For platform-critical infrastructure (Keycloak, Vault) that every other
  service depends on to function at all. Well above default app pods
  (implicit priority 0) so the scheduler/kubelet prefers keeping these
  running and prioritizes scheduling them first, but well below true
  cluster-system priority classes (system-cluster-critical /
  system-node-critical, ~2000000000+) so this never competes with real
  Kubernetes system components.
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: default
spec:
  limits:
    - type: Container
      # Applied to any container that doesn't set its own resources
      # (defense in depth — every Deployment/StatefulSet in this repo now
      # sets explicit resources, but this protects against a future one
      # that forgets to).
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      # Bounds even on containers that DO set their own resources — catches
      # an obvious typo (e.g. "50" instead of "50m") before it eats the
      # whole node.
      max:
        cpu: "2"
        memory: 4Gi
      min:
        cpu: 10m
        memory: 32Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: default
spec:
  hard:
    # requests must fit real node capacity (8 CPU / ~30.8Gi allocatable) -
    # left just under that ceiling since the scheduler enforces the real
    # limit anyway; this just avoids the quota adding an artificial extra
    # constraint below it. Covers the worst case of 7 backend services'
    # HPAs (charts/landers-app: autoscaling maxReplicas: 3) all scaling to
    # max simultaneously (~6.25 CPU / ~14.7Gi worth of additional requests
    # on top of the current single-replica baseline).
    requests.cpu: "7"
    requests.memory: 24Gi
    # limits are a declared-ceiling admission check, not a real resource
    # promise (Kubernetes limits are meant to be overcommitted - CPU just
    # throttles, doesn't OOM). Sized generously above the same HPA
    # worst-case (~29 CPU / ~31Gi at full scale-out) so autoscaling is
    # never blocked by quota admission, not because the node can actually
    # deliver this much simultaneously.
    limits.cpu: "32"
    limits.memory: 36Gi
    pods: "60"
