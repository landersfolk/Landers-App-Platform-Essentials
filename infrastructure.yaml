# Trimmed 2026-07-24. This file used to also contain dev-mode Vault, MySQL, Postgres,
# Kafka/Kafdrop, Keycloak, and Redis sections — all of those now have their own
# dedicated, correct, git-tracked manifests elsewhere (vault-production/, RDS directly,
# landers-app-deployments/kafka-and-kafdrop.yaml, landers-app-deployments/
# keycloack-deployment.yaml, landers-app-deployments/redis-qa.yaml). Keeping duplicate
# definitions here was actively dangerous, not just redundant: this file's old Keycloak
# and Redis sections shared the EXACT SAME resource names (keycloak-config,
# keycloak-secret, keycloak Deployment/Service, redis Deployment, redis-db Service) as
# the correct ones — re-applying this file for its actually-still-needed Artifactory
# section silently clobbered the real Keycloak/Redis config back to old dev-mode
# defaults (discovered for real 2026-07-24, mid-QA-setup, requiring a live-cluster
# recovery). This file now contains ONLY the RBAC block and Artifactory — the two
# pieces Part 7.3 of EC2_QA_Environment_Setup_Guide.txt actually still needs from it.
# ========================================================
# 1. RBAC CONFIGURATION
# Allows Spring Boot to read its own configuration from K8s
# ========================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps", "pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-reader-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default
roleRef:
  kind: Role
  name: config-reader
  apiGroup: rbac.authorization.k8s.io

# ==========================================
# 2. ARTIFACTORY (JFrog)
# ==========================================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: artifactory-data
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: jfrog-artifactory
spec:
  selector:
    app: artifactory
  ports:
    - name: api
      port: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifactory
spec:
  selector:
    matchLabels:
      app: artifactory
  template:
    metadata:
      labels:
        app: artifactory
    spec:
      containers:
      - name: artifactory
        image: releases-docker.jfrog.io/jfrog/artifactory-oss:7.71.5
        resources:
          requests:
            memory: "2Gi"
        ports:
        - containerPort: 8082
        volumeMounts:
        - name: storage
          mountPath: /var/opt/jfrog/artifactory
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: artifactory-data
