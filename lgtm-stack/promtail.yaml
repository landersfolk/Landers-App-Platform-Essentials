apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: default
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    
    positions:
      filename: /run/promtail/positions.yaml
    
    clients:
      - url: http://loki:3100/loki/api/v1/push
    
    scrape_configs:
      - job_name: kubernetes-pods
        static_configs:
          - targets:
              - localhost
            labels:
              job: kubernetes-pods
              __path__: /var/log/pods/default_*/*/*.log
        
        pipeline_stages:
          - regex:
              expression: '^/var/log/pods/default_(?P<pod_name>[^_]+)-[^_]+_[^/]+/(?P<container>[^/]+)/.*\.log$'
              source: filename
          
          - labels:
              pod_name:
              container:
          
          - match:
              selector: '{pod_name=~"gateway-service.*"}'
              stages:
                - static_labels:
                    app: gateway-service

          - match:
              selector: '{pod_name=~"landlord-service.*"}'
              stages:
                - static_labels:
                    app: landlord-service

          - match:
              selector: '{pod_name=~"admin-service.*"}'
              stages:
                - static_labels:
                    app: admin-service

          - match:
              selector: '{pod_name=~"booking-service.*"}'
              stages:
                - static_labels:
                    app: booking-service

          - match:
              selector: '{pod_name=~"corporate-service.*"}'
              stages:
                - static_labels:
                    app: corporate-service

          - match:
              selector: '{pod_name=~"requester-service.*"}'
              stages:
                - static_labels:
                    app: requester-service

          - match:
              selector: '{pod_name=~"user-service.*"}'
              stages:
                - static_labels:
                    app: user-service

          - match:
              selector: '{pod_name=~"payment-service.*"}'
              stages:
                - static_labels:
                    app: payment-service

          - match:
              selector: '{pod_name=~"notification-service.*"}'
              stages:
                - static_labels:
                    app: notification-service

          - match:
              selector: '{pod_name=~"admin-dashboard.*"}'
              stages:
                - static_labels:
                    app: admin-dashboard

          - match:
              selector: '{pod_name=~"lander-web.*"}'
              stages:
                - static_labels:
                    app: lander-web
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: default
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
      - name: promtail
        image: grafana/promtail:2.9.0
        args:
          - -config.file=/etc/promtail/promtail.yaml
        
        resources:
          requests:
            cpu: 50m
            memory: 100Mi
          limits:
            cpu: 200m
            memory: 200Mi
        
        securityContext:
          runAsUser: 0
        
        volumeMounts:
        - name: config
          mountPath: /etc/promtail
        - name: run
          mountPath: /run/promtail
        - name: varlog
          mountPath: /var/log
          readOnly: true
        
        ports:
        - containerPort: 9080
          name: http-metrics
        livenessProbe:
          httpGet:
            path: /ready
            port: 9080
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 9080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

      volumes:
      - name: config
        configMap:
          name: promtail-config
      - name: run
        emptyDir: {}
      - name: varlog
        hostPath:
          path: /var/log
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
- apiGroups: [""]
  resources:
  - nodes
  - pods
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
- kind: ServiceAccount
  name: promtail
  namespace: default
