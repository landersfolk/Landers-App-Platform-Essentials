apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "landers-app.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "landers-app.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "landers-app.name" . }}
      {{- if .Values.prometheus.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.containerPort }}"
        prometheus.io/path: "{{ .Values.prometheus.path }}"
      {{- end }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 30 }}
      containers:
        - name: {{ include "landers-app.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.vault.enabled }}
            - name: VAULT_HOST
              value: {{ .Values.vault.host | quote }}
            - name: VAULT_PORT
              value: {{ .Values.vault.port | quote }}
            - name: VAULT_SCHEME
              value: {{ .Values.vault.scheme | quote }}
            - name: VAULT_AUTH_METHOD
              value: {{ .Values.vault.authMethod | quote }}
            {{- if eq .Values.vault.authMethod "APPROLE" }}
            # QA/prod: scoped AppRole identity per service (see
            # vault-production/setup-approle.sh), role_id/secret_id from a
            # pre-created k8s Secret named vault.secretName.
            - name: VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vault.secretName }}
                  key: role_id
            - name: VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vault.secretName }}
                  key: secret_id
            {{- else }}
            # dev (this cluster): shared root token, matching every service's
            # own application.yml default (VAULT_AUTH_METHOD unset -> TOKEN)
            # and vault-seed-secrets.sh's `vault login root`. No k8s Secret
            # needed -- same as running the service locally from an IDE.
            - name: VAULT_TOKEN
              value: {{ .Values.vault.token | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.infisical.enabled }}
            # Infisical replaces Vault for secrets management. Client ID/Secret come
            # from a pre-created k8s Secret (see infisical.secretName) - never inlined
            # here. INFISICAL_ENV selects the Infisical environment slug (dev/staging/prod).
            # HOST/PROJECT_ID identify the shared Infisical Cloud project - overridable here
            # instead of only via InfisicalEnvironmentPostProcessor's Java fallback constants.
            - name: INFISICAL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.infisical.secretName }}
                  key: INFISICAL_CLIENT_ID
            - name: INFISICAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.infisical.secretName }}
                  key: INFISICAL_CLIENT_SECRET
            - name: INFISICAL_ENV
              value: {{ .Values.infisical.env | quote }}
            - name: INFISICAL_HOST
              value: {{ .Values.infisical.host | quote }}
            - name: INFISICAL_PROJECT_ID
              value: {{ .Values.infisical.projectId | quote }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.containerPort }}
            periodSeconds: {{ .Values.probes.startupPeriodSeconds }}
            failureThreshold: {{ .Values.probes.startupFailureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.containerPort }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.containerPort }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          {{- end }}
