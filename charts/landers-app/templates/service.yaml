apiVersion: v1
kind: Service
metadata:
  name: {{ include "landers-app.name" . }}
  labels:
    {{- include "landers-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector:
    app: {{ include "landers-app.name" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
