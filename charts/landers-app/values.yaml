# Defaults — every field here is overridden per-service in apps/<service>/values.yaml.
nameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/landersfolk/CHANGEME
  tag: "latest"
  pullPolicy: Always

# ghcr.io packages pushed via GITHUB_TOKEN from a private repo default to
# private visibility -- every service needs this to actually pull its image.
# Create the Secret once per cluster/namespace:
#   kubectl create secret docker-registry ghcr-pull-secret \
#     --docker-server=ghcr.io --docker-username=<gh-username> \
#     --docker-password=<PACKAGES_PAT PAT value> -n default
imagePullSecrets:
  - ghcr-pull-secret

containerPort: 8080

service:
  port: 8080

# Plain string env vars merged onto the container (SPRING_PROFILES_ACTIVE, etc).
env: {}

# Set vault.enabled: false for frontends, which don't talk to Vault directly.
# authMethod: APPROLE (QA/prod) needs vault.secretName pointing at a pre-created
# k8s Secret with role_id/secret_id (see deploy/09-deploy-services.sh's Vault
# AppRole bootstrap / vault-production/setup-approle.sh). authMethod: TOKEN
# (dev clusters, e.g. k3d) just uses vault.token directly, no Secret needed --
# matches every service's own application.yml default and
# vault-seed-secrets.sh's shared root token.
vault:
  enabled: false
  host: vault-prod
  port: "8200"
  scheme: http
  authMethod: APPROLE
  secretName: ""
  token: ""

# Prometheus scrape annotations — backend services only (Spring Actuator).
prometheus:
  enabled: false
  path: /actuator/prometheus

resources: {}

# Set true to add a basic CPU-based HPA. Off by default — keep it simple until needed.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
