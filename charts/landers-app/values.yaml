# Defaults — every field here is overridden per-service in apps/<service>/values.yaml.
nameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/landersfolk/CHANGEME
  tag: "latest"
  pullPolicy: Always

# ghcr.io packages pushed via GITHUB_TOKEN from a private repo default to
# private visibility -- every service needs this to actually pull its image.
# Create the Secret once per cluster/namespace:
#   kubectl create secret docker-registry ghcr-pull-secret \
#     --docker-server=ghcr.io --docker-username=<gh-username> \
#     --docker-password=<PACKAGES_PAT PAT value> -n default
imagePullSecrets:
  - ghcr-pull-secret

containerPort: 8080

service:
  port: 8080
  # ClusterIP for everything by default. Override to LoadBalancer for
  # externally-routed services (gateway-service, the two frontends on QA/prod)
  # -- matches the ALB target group / host-port routing those already use.
  type: ClusterIP

# Plain string env vars merged onto the container (SPRING_PROFILES_ACTIVE, etc).
env: {}

# Set vault.enabled: false for frontends, which don't talk to Vault directly.
# authMethod: APPROLE (QA/prod) needs vault.secretName pointing at a pre-created
# k8s Secret with role_id/secret_id (see deploy/09-deploy-services.sh's Vault
# AppRole bootstrap / vault-production/setup-approle.sh). authMethod: TOKEN
# (dev clusters, e.g. k3d) just uses vault.token directly, no Secret needed --
# matches every service's own application.yml default and
# vault-seed-secrets.sh's shared root token.
vault:
  enabled: false
  host: vault-prod
  port: "8200"
  scheme: http
  authMethod: APPROLE
  secretName: ""
  token: ""

# Prometheus scrape annotations — backend services only (Spring Actuator).
prometheus:
  enabled: false
  path: /actuator/prometheus

# Sized for a Spring Boot 3.5/JVM 21 service under modest QA/dev load — in the
# same ballpark as this cluster's Keycloak/Vault sizing for consistency.
# Frontends override this with a much lighter nginx-appropriate profile (see
# apps/lander-web and apps/admin-dashboard values.yaml).
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Liveness/readiness/startup probes. path defaults to Spring Actuator's health
# endpoint on the same containerPort apps already expose it on (confirmed
# already reachable there — gateway-service's own SecurityConfig permits
# /actuator/health, and /actuator/prometheus scraping already works on this
# port for every backend service). Frontends override path to "/" (nginx has
# no /actuator/health) — see apps/lander-web and apps/admin-dashboard.
#
# A startupProbe (not just liveness/readiness) is used deliberately: Flyway
# migrations + full Spring context startup can take well beyond a fixed
# initialDelaySeconds, and a slow-starting pod getting killed by liveness
# mid-migration is worse than a plain slow start. Once startupProbe succeeds,
# liveness/readiness take over with their own tighter periodSeconds.
probes:
  enabled: true
  path: /actuator/health
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
  startupFailureThreshold: 30
  startupPeriodSeconds: 5

# Graceful shutdown window (SIGTERM -> SIGKILL). Spring Boot's own graceful
# shutdown (server.shutdown=graceful, already the framework default) needs
# real time to drain in-flight requests before the process gets killed.
terminationGracePeriodSeconds: 30

# Empty by default — set per-service (e.g. to a "critical-infra" PriorityClass)
# for anything the rest of the platform can't function without. None of the
# 11 app services set this today; it exists in the chart for consistency and
# in case that changes (e.g. gateway-service, being the sole ingress point).
priorityClassName: ""

# Set true to add a basic CPU-based HPA. Off by default — keep it simple until needed.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
