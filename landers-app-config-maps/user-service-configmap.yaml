apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: default
data:
  application.yaml: |-
    ---
    # DEV Profile
    spring:
      config:
        activate:
          on-profile: dev
      datasource:
        url: jdbc:mysql://localhost:3306/landers-app-lander-db
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 5
      jpa:
        hibernate:
          ddl-auto: none
        show-sql: true
        properties:
          hibernate:
            format_sql: true
            dialect: org.hibernate.dialect.MySQLDialect
            globally_quoted_identifiers: true
      jackson:
        serialization:
          write-dates-as-timestamps: false
      kafka:
        bootstrap-servers: localhost:9093
        group-id: user-service-group
        topics:
          userRegistrationLandlord: user-registration-landlord
          userRegistrationRequester: user-registration-requester
          userRegistrationAdmin: user-registration-admin
          userRegistrationCorporate: user-registration-corporate
          userRegistrationLandlordDlt: user-registration-landlord-dlt
          userRegistrationRequesterDlt: user-registration-requester-dlt
          userRegistrationAdminDlt: user-registration-admin-dlt
          userRegistrationCorporateDlt: user-registration-corporate-dlt
          userDeleted: user-deleted
          userDeletedDlt: user-deleted-dlt
        producer:
          acks: all
          retries: 3
          deliveryTimeoutMs: 30000
          requestTimeoutMs: 20000
        consumer:
          auto-offset-reset: earliest
          enable-auto-commit: false
          trustedPackages: io.landers.commons.cloud.events
          defaultValueType: io.landers.commons.cloud.events.UserRegisterEvent
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: http://localhost:8180/realms/landers-realm
              jwk-set-uri: http://localhost:8180/realms/landers-realm/protocol/openid-connect/certs

    keycloak:
      auth-server-url: http://localhost:8180
      tokenUrl: http://localhost:8180/realms/landers-realm/protocol/openid-connect/token
      grantType: password
      realm: landers-realm

    jwt:
      auth:
        converter:
          resource-id: landers-app
          principle-attribute: preferred_username

    server:
      port: 7075

    ---
    # QA Profile
    spring:
      config:
        activate:
          on-profile: qa
      datasource:
        url: jdbc:mysql://mysql-db:3306/landers-app-lander-db
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 10
          connection-timeout: 30000
      jpa:
        hibernate:
          ddl-auto: none
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.MySQLDialect
            globally_quoted_identifiers: true
      jackson:
        serialization:
          write-dates-as-timestamps: false
      kafka:
        bootstrap-servers: kafka-broker:9092
        group-id: user-service-group
        topics:
          userRegistrationLandlord: user-registration-landlord
          userRegistrationRequester: user-registration-requester
          userRegistrationAdmin: user-registration-admin
          userRegistrationCorporate: user-registration-corporate
          userRegistrationLandlordDlt: user-registration-landlord-dlt
          userRegistrationRequesterDlt: user-registration-requester-dlt
          userRegistrationAdminDlt: user-registration-admin-dlt
          userRegistrationCorporateDlt: user-registration-corporate-dlt
          userDeleted: user-deleted
          userDeletedDlt: user-deleted-dlt
        producer:
          acks: all
          retries: 3
          deliveryTimeoutMs: 30000
          requestTimeoutMs: 20000
        consumer:
          auto-offset-reset: earliest
          enable-auto-commit: false
          trustedPackages: io.landers.commons.cloud.events
          defaultValueType: io.landers.commons.cloud.events.UserRegisterEvent
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: http://keycloak:8180/realms/landers-realm
              jwk-set-uri: http://keycloak:8180/realms/landers-realm/protocol/openid-connect/certs

    keycloak:
      auth-server-url: http://keycloak:8180
      tokenUrl: http://keycloak:8180/realms/landers-realm/protocol/openid-connect/token
      grantType: password
      realm: landers-realm

    jwt:
      auth:
        converter:
          resource-id: landers-app
          principle-attribute: preferred_username

    server:
      port: 7075

    ---
    # PROD Profile
    spring:
      config:
        activate:
          on-profile: prod
      datasource:
        url: jdbc:mysql://mysql-db-prod:3306/landers-app-lander-db
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 20
          connection-timeout: 20000
          minimum-idle: 10
          idle-timeout: 600000
          max-lifetime: 1800000
      jpa:
        hibernate:
          ddl-auto: none
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.MySQLDialect
            globally_quoted_identifiers: true
      jackson:
        serialization:
          write-dates-as-timestamps: false
      kafka:
        bootstrap-servers: kafka-broker:9092
        group-id: user-service-group
        topics:
          userRegistrationLandlord: user-registration-landlord
          userRegistrationRequester: user-registration-requester
          userRegistrationAdmin: user-registration-admin
          userRegistrationCorporate: user-registration-corporate
          userRegistrationLandlordDlt: user-registration-landlord-dlt
          userRegistrationRequesterDlt: user-registration-requester-dlt
          userRegistrationAdminDlt: user-registration-admin-dlt
          userRegistrationCorporateDlt: user-registration-corporate-dlt
          userDeleted: user-deleted
          userDeletedDlt: user-deleted-dlt
        producer:
          acks: all
          retries: 5
          deliveryTimeoutMs: 45000
          requestTimeoutMs: 30000
        consumer:
          auto-offset-reset: earliest
          enable-auto-commit: false
          trustedPackages: io.landers.commons.cloud.events
          defaultValueType: io.landers.commons.cloud.events.UserRegisterEvent
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: http://keycloak:8180/realms/landers-realm
              jwk-set-uri: http://keycloak:8180/realms/landers-realm/protocol/openid-connect/certs

    keycloak:
      auth-server-url: http://keycloak:8180
      tokenUrl: http://keycloak:8180/realms/landers-realm/protocol/openid-connect/token
      grantType: password
      realm: landers-realm

    jwt:
      auth:
        converter:
          resource-id: landers-app
          principle-attribute: preferred_username

    server:
      port: 7075
