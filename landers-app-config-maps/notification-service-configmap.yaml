apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: default
data:
  application.yaml: |-
    ---
    # DEV Profile
    landers:
      outbox:
        enabled: true
    spring:
      config:
        activate:
          on-profile: dev
      datasource:
        url: jdbc:postgresql://localhost:5432/landers-app-lander-db
        driver-class-name: org.postgresql.Driver
        hikari:
          maximum-pool-size: 5
      data:
        redis:
          host: localhost
          port: 6379
      cache:
        type: redis
      flyway:
        enabled: true
        locations: classpath:db/migration
        lock-retry-count: 10
        schemas: notification_service
        default-schema: notification_service
        create-schemas: false
        url: jdbc:postgresql://localhost:5432/landers-app-lander-db
      jpa:
        hibernate:
          ddl-auto: none
        show-sql: true
        properties:
          hibernate:
            format_sql: true
            dialect: org.hibernate.dialect.PostgreSQLDialect
            globally_quoted_identifiers: true
      jackson:
        serialization:
          write-dates-as-timestamps: false
      # --- Kafka Configuration ---
      kafka:
        bootstrap-servers: localhost:9093
        group-id: notification-service-group
        topics:
          bookingStatusChanged: booking-status-changed
          announcementCreated: announcement-created
          landApproved: land-approved
          walletThresholdCrossed: wallet-threshold-crossed
        producer:
          acks: all
          retries: 3
          deliveryTimeoutMs: 30000
          requestTimeoutMs: 20000
        consumer:
          auto-offset-reset: earliest
          enable-auto-commit: false
          trustedPackages: io.landers.commons.cloud.events
          defaultValueType: io.landers.commons.cloud.events.UserRegisterEvent
      # --- Security Configuration ---
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: http://localhost:8180/realms/landers-realm
              jwk-set-uri: http://localhost:8180/realms/landers-realm/protocol/openid-connect/certs

    keycloak:
      auth-server-url: http://localhost:8180
      tokenUrl: http://localhost:8180/realms/landers-realm/protocol/openid-connect/token
      grantType: password
      realm: landers-realm

    jwt:
      auth:
        converter:
          resource-id: landers-app
          principle-attribute: preferred_username

    # Firebase Admin service-account key (raw JSON). Empty by default — push notifications
    # no-op gracefully until this is set via Vault (secret/landers-app/notification-service).
    firebase:
      credentials-json: ""

    # WhatsApp OTP sender: META (Cloud API, secrets under Infisical /META) or WAPILOT.
    otp:
      provider:
        whatsapp:
          active-vendor: META

    server:
      port: 7078

    ---
    # QA Profile
    landers:
      outbox:
        enabled: true
    spring:
      config:
        activate:
          on-profile: qa
      datasource:
        url: jdbc:postgresql://landers-db.c52kk2mayopg.eu-west-1.rds.amazonaws.com:5432/landers-app-lander-db?sslmode=require
        driver-class-name: org.postgresql.Driver
        hikari:
          maximum-pool-size: 10
          connection-timeout: 30000
      data:
        redis:
          host: redis-db
          port: 6379
      cache:
        type: redis
      flyway:
        enabled: true
        locations: classpath:db/migration
        lock-retry-count: 10
        schemas: notification_service
        default-schema: notification_service
        create-schemas: false
        url: jdbc:postgresql://landers-db.c52kk2mayopg.eu-west-1.rds.amazonaws.com:5432/landers-app-lander-db?sslmode=require
      jpa:
        hibernate:
          ddl-auto: none
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
            globally_quoted_identifiers: true
      jackson:
        serialization:
          write-dates-as-timestamps: false
      cloud:
        kubernetes:
          discovery:
            enabled: true
      # --- Kafka Configuration ---
      kafka:
        bootstrap-servers: kafka-broker:9092
        group-id: notification-service-group
        topics:
          bookingStatusChanged: booking-status-changed
          announcementCreated: announcement-created
          landApproved: land-approved
          walletThresholdCrossed: wallet-threshold-crossed
        producer:
          acks: all
          retries: 3
          deliveryTimeoutMs: 30000
          requestTimeoutMs: 20000
        consumer:
          auto-offset-reset: earliest
          enable-auto-commit: false
          trustedPackages: io.landers.commons.cloud.events
          defaultValueType: io.landers.commons.cloud.events.UserRegisterEvent
      # --- Security Configuration ---
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: https://keycloak-qa.landersfolk.com/realms/landers-realm
              jwk-set-uri: https://keycloak-qa.landersfolk.com/realms/landers-realm/protocol/openid-connect/certs

    keycloak:
      auth-server-url: http://keycloak:8180
      tokenUrl: https://keycloak-qa.landersfolk.com/realms/landers-realm/protocol/openid-connect/token
      grantType: password
      realm: landers-realm

    jwt:
      auth:
        converter:
          resource-id: landers-app
          principle-attribute: preferred_username

    firebase:
      credentials-json: ""

    # WhatsApp OTP sender: META (Cloud API, secrets under Infisical /META) or WAPILOT.
    otp:
      provider:
        whatsapp:
          active-vendor: META

    server:
      port: 7078

    ---
    # PROD Profile
    landers:
      outbox:
        enabled: true
    spring:
      config:
        activate:
          on-profile: prod
      datasource:
        url: jdbc:postgresql://postgres-db:5432/landers-app-lander-db
        driver-class-name: org.postgresql.Driver
        hikari:
          maximum-pool-size: 12   # 8 services x up to 3 replicas x 12 = 288, inside the ~420 connections of db.t3.medium (was 20: 480)
          connection-timeout: 20000
          minimum-idle: 4
          idle-timeout: 600000
          max-lifetime: 1800000
      data:
        redis:
          host: redis-db-prod
          port: 6379
      cache:
        type: redis
      flyway:
        enabled: true
        locations: classpath:db/migration
        lock-retry-count: 10
        schemas: notification_service
        default-schema: notification_service
        create-schemas: false
        url: jdbc:postgresql://postgres-db:5432/landers-app-lander-db
      jpa:
        hibernate:
          ddl-auto: none
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.PostgreSQLDialect
            globally_quoted_identifiers: true
      jackson:
        serialization:
          write-dates-as-timestamps: false
      cloud:
        kubernetes:
          discovery:
            enabled: true
      # --- Kafka Configuration ---
      kafka:
        bootstrap-servers: kafka-broker:9092
        group-id: notification-service-group
        topics:
          bookingStatusChanged: booking-status-changed
          announcementCreated: announcement-created
          landApproved: land-approved
          walletThresholdCrossed: wallet-threshold-crossed
        producer:
          acks: all
          retries: 5
          deliveryTimeoutMs: 45000
          requestTimeoutMs: 30000
        consumer:
          auto-offset-reset: earliest
          enable-auto-commit: false
          trustedPackages: io.landers.commons.cloud.events
          defaultValueType: io.landers.commons.cloud.events.UserRegisterEvent
      # --- Security Configuration ---
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: http://keycloak:8180/realms/landers-realm
              jwk-set-uri: http://keycloak:8180/realms/landers-realm/protocol/openid-connect/certs

    keycloak:
      auth-server-url: http://keycloak:8180
      tokenUrl: http://keycloak:8180/realms/landers-realm/protocol/openid-connect/token
      grantType: password
      realm: landers-realm

    jwt:
      auth:
        converter:
          resource-id: landers-app
          principle-attribute: preferred_username

    firebase:
      credentials-json: ""

    # WhatsApp OTP sender: META (Cloud API, secrets under Infisical /META) or WAPILOT.
    otp:
      provider:
        whatsapp:
          active-vendor: META

    server:
      port: 7078
