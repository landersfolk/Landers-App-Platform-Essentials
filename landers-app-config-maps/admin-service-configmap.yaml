apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-service-config
  namespace: default
data:
  application.yaml: |-
    ---
    # DEV Profile
    spring:
      config:
        activate:
          on-profile: dev
      datasource:
        url: jdbc:mysql://localhost:3306/landers-app-lander-db
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 5
      data:
        redis:
          host: localhost
          port: 6379
      cache:
        type: redis
      flyway:
        enabled: true
        locations: classpath:db/migration
        lock-retry-count: 10
        url: jdbc:mysql://localhost:3306/landers-app-lander-db
      jpa:
        hibernate:
          ddl-auto: none
        show-sql: true
        properties:
          hibernate:
            format_sql: true
            dialect: org.hibernate.dialect.MySQLDialect
            globally_quoted_identifiers: true
      jackson:
        serialization:
          write-dates-as-timestamps: false
      cloud:
        kubernetes:
          discovery:
            enabled: true
        openfeign:
          client:
            config:
              land-lord-service:
                url: http://localhost:7073
              requester-service:
                url: http://localhost:7072
              corporate-service:
                url: http://localhost:7074
      # --- Kafka Configuration ---
      kafka:
        bootstrapServers: localhost:9093
        groupId: admin-service-group
        topics:
          userRegistrationLandlord: user-registration-landlord
          userRegistrationRequester: user-registration-requester
          userRegistrationAdmin: user-registration-admin
          userRegistrationLandlordDlt: user-registration-landlord-dlt
          userRegistrationRequesterDlt: user-registration-requester-dlt
          userRegistrationAdminDlt: user-registration-admin-dlt
        producer:
          acks: all
          retries: 3
          deliveryTimeoutMs: 30000
          requestTimeoutMs: 20000
        consumer:
          autoOffsetReset: earliest
          enableAutoCommit: false
          trustedPackages: io.landers.commons.cloud.events
          defaultValueType: io.landers.commons.cloud.events.UserRegisterEvent
      # --- Security Configuration ---
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: http://localhost:8180/realms/landers-realm
              jwk-set-uri: http://localhost:8180/realms/landers-realm/protocol/openid-connect/certs

    keycloak:
      auth-server-url: http://localhost:8180
      tokenUrl: http://localhost:8180/realms/landers-realm/protocol/openid-connect/token
      grantType: password
      realm: landers-realm

    jwt:
      auth:
        converter:
          resource-id: landers-app
          principle-attribute: preferred_username

    server:
      port: 7071
    media:
      upload:
        base-path: uploads/admin

    ---
    # QA Profile
    spring:
      config:
        activate:
          on-profile: qa
      datasource:
        url: jdbc:mysql://mysql-db:3306/landers-app-lander-db
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 10
          connection-timeout: 30000
      data:
        redis:
          host: redis-db
          port: 6379
      cache:
        type: redis
      flyway:
        enabled: true
        locations: classpath:db/migration
        lock-retry-count: 10
        url: jdbc:mysql://mysql-db:3306/landers-app-lander-db
      jpa:
        hibernate:
          ddl-auto: none
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.MySQLDialect
            globally_quoted_identifiers: true
      jackson:
        serialization:
          write-dates-as-timestamps: false
      cloud:
        kubernetes:
          discovery:
            enabled: true
        # NO openfeign.client.config here - uses service discovery lb://
      # --- Kafka Configuration ---
      kafka:
        bootstrapServers: kafka-broker:9092
        groupId: admin-service-group
        topics:
          userRegistrationLandlord: user-registration-landlord
          userRegistrationRequester: user-registration-requester
          userRegistrationAdmin: user-registration-admin
          userRegistrationLandlordDlt: user-registration-landlord-dlt
          userRegistrationRequesterDlt: user-registration-requester-dlt
          userRegistrationAdminDlt: user-registration-admin-dlt
        producer:
          acks: all
          retries: 3
          deliveryTimeoutMs: 30000
          requestTimeoutMs: 20000
        consumer:
          autoOffsetReset: earliest
          enableAutoCommit: false
          trustedPackages: io.landers.commons.cloud.events
          defaultValueType: io.landers.commons.cloud.events.UserRegisterEvent
      # --- Security Configuration ---
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: http://keycloak:8180/realms/landers-realm
              jwk-set-uri: http://keycloak:8180/realms/landers-realm/protocol/openid-connect/certs

    keycloak:
      auth-server-url: http://keycloak:8180
      tokenUrl: http://keycloak:8180/realms/landers-realm/protocol/openid-connect/token
      grantType: password
      realm: landers-realm

    jwt:
      auth:
        converter:
          resource-id: landers-app
          principle-attribute: preferred_username

    server:
      port: 7071
    media:
      upload:
        base-path: uploads/admin

    ---
    # PROD Profile
    spring:
      config:
        activate:
          on-profile: prod
      datasource:
        url: jdbc:mysql://mysql-db-prod:3306/landers-app-lander-db
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 20
          connection-timeout: 20000
          minimum-idle: 10
          idle-timeout: 600000
          max-lifetime: 1800000
      data:
        redis:
          host: redis-db-prod
          port: 6379
      cache:
        type: redis
      flyway:
        enabled: true
        locations: classpath:db/migration
        lock-retry-count: 10
        url: jdbc:mysql://mysql-db-prod:3306/landers-app-lander-db
      jpa:
        hibernate:
          ddl-auto: none
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.MySQLDialect
            globally_quoted_identifiers: true
      jackson:
        serialization:
          write-dates-as-timestamps: false
      cloud:
        kubernetes:
          discovery:
            enabled: true
        # NO openfeign.client.config here - uses service discovery lb://
      # --- Kafka Configuration ---
      kafka:
        bootstrapServers: kafka-broker:9092
        groupId: admin-service-group
        topics:
          userRegistrationLandlord: user-registration-landlord
          userRegistrationRequester: user-registration-requester
          userRegistrationAdmin: user-registration-admin
          userRegistrationLandlordDlt: user-registration-landlord-dlt
          userRegistrationRequesterDlt: user-registration-requester-dlt
          userRegistrationAdminDlt: user-registration-admin-dlt
        producer:
          acks: all
          retries: 5
          deliveryTimeoutMs: 45000
          requestTimeoutMs: 30000
        consumer:
          autoOffsetReset: earliest
          enableAutoCommit: false
          trustedPackages: io.landers.commons.cloud.events
          defaultValueType: io.landers.commons.cloud.events.UserRegisterEvent
      # --- Security Configuration ---
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: http://keycloak:8180/realms/landers-realm
              jwk-set-uri: http://keycloak:8180/realms/landers-realm/protocol/openid-connect/certs

    keycloak:
      auth-server-url: http://keycloak:8180
      tokenUrl: http://keycloak:8180/realms/landers-realm/protocol/openid-connect/token
      grantType: password
      realm: landers-realm

    jwt:
      auth:
        converter:
          resource-id: landers-app
          principle-attribute: preferred_username

    server:
      port: 7071
    media:
      upload:
        base-path: uploads/admin
