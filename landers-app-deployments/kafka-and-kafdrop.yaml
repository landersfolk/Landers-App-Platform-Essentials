---
# ============================================================
# Kafka StatefulSet (KRaft mode - no ZooKeeper)
# Image: apache/kafka:3.9.2
#
# Two listeners:
#   INTERNAL (9092) → used by pods inside the cluster
#   EXTERNAL (9093) → used when port-forwarding from local dev
#                     advertises localhost:9093 so Kafka metadata
#                     points back to localhost and not kafka-broker
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  serviceName: kafka-broker
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.2
          ports:
            - name: internal
              containerPort: 9092
            - name: external
              containerPort: 9093
            - name: controller
              containerPort: 9094
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9094"

            # INTERNAL → in-cluster traffic (your app pod → kafka-broker:9092)
            # EXTERNAL → local dev via port-forward (localhost:9093)
            # CONTROLLER → KRaft internal only
            - name: KAFKA_LISTENERS
              value: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://kafka-broker:9092,EXTERNAL://localhost:9093"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            # Generate your own with: kubectl exec -it kafka-0 -- kafka-storage.sh random-uuid
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: "your-ks3-storage-class"  # ← set your KS3 storage class here
        resources:
          requests:
            storage: 10Gi

---
# ============================================================
# Kafka Service
#   Port 9092 → in-cluster access (kafka-broker:9092)
#   Port 9093 → port-forward for local dev
#
# Local dev usage:
#   kubectl port-forward svc/kafka-broker 9093:9093
#   spring.kafka.bootstrap-servers=localhost:9093
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: kafka-broker
  labels:
    app: kafka
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - name: internal
      port: 9092
      targetPort: 9092
      protocol: TCP
    - name: external
      port: 9093
      targetPort: 9093
      protocol: TCP

---
# ============================================================
# Kafdrop Deployment
# Image: obsidiandynamics/kafdrop:4.2.0
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafdrop
  labels:
    app: kafdrop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafdrop
  template:
    metadata:
      labels:
        app: kafdrop
    spec:
      containers:
        - name: kafdrop
          image: obsidiandynamics/kafdrop:4.2.0
          ports:
            - containerPort: 9000
          env:
            - name: KAFKA_BROKERCONNECT
              value: "kafka-broker:9092"
            - name: SERVER_SERVLET_CONTEXTPATH
              value: "/"
            - name: JVM_OPTS
              # Bumped 2026-07-24 — the original -Xmx128M/256Mi limit OOMKilled
              # (exit 137) on every startup. Kafdrop 4.2.0 is a Spring Boot 3.x app;
              # 128M heap isn't enough headroom for its own startup (embedded
              # servlet container, Kafka client, actuator) even before serving
              # any real traffic.
              value: "-Xms128M -Xmx256M"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              # Bumped alongside JVM_OPTS above — container limit needs real
              # headroom beyond -Xmx (JVM metaspace, thread stacks, direct
              # buffers all live outside the heap).
              memory: "512Mi"

---
# ============================================================
# Kafdrop Service
# Access locally: kubectl port-forward svc/kafdrop 9000:9000
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: kafdrop
  labels:
    app: kafdrop
spec:
  type: ClusterIP
  selector:
    app: kafdrop
  ports:
    - name: http
      port: 9000
      targetPort: 9000
      protocol: TCP
