apiVersion: apps/v1
kind: Deployment
metadata:
  name: corporate-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: corporate-service
  template:
    metadata:
      labels:
        app: corporate-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7074"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: corporate-service
        image: localhost:5000/corporate-service:qa
        imagePullPolicy: Always
        ports:
        - containerPort: 7074
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "qa"
        - name: VAULT_HOST
          value: "vault-prod"
        - name: VAULT_PORT
          value: "8200"
        - name: VAULT_SCHEME
          value: "http"
        - name: VAULT_AUTH_METHOD
          value: "APPROLE"
        - name: VAULT_ROLE_ID
          valueFrom:
            secretKeyRef:
              name: corporate-service-vault-creds
              key: role_id
        - name: VAULT_SECRET_ID
          valueFrom:
            secretKeyRef:
              name: corporate-service-vault-creds
              key: secret_id
---
apiVersion: v1
kind: Service
metadata:
  name: corporate-service
spec:
  selector:
    app: corporate-service
  ports:
    - port: 7074
      targetPort: 7074
