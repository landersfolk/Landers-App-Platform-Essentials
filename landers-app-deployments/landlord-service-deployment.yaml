apiVersion: apps/v1
kind: Deployment
metadata:
  name: landlord-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landlord-service
  template:
    metadata:
      labels:
        app: landlord-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7073"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: landlord-service
        image: localhost:5000/landlord-service:qa
        imagePullPolicy: Always
        ports:
        - containerPort: 7073
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "qa"
        - name: VAULT_HOST
          value: "vault-prod"
        - name: VAULT_PORT
          value: "8200"
        - name: VAULT_SCHEME
          value: "http"
        - name: VAULT_AUTH_METHOD
          value: "APPROLE"
        - name: VAULT_ROLE_ID
          valueFrom:
            secretKeyRef:
              name: landlord-service-vault-creds
              key: role_id
        - name: VAULT_SECRET_ID
          valueFrom:
            secretKeyRef:
              name: landlord-service-vault-creds
              key: secret_id
---
# Service MUST be named exactly "landlord-service" (not "land-lord-service", which the
# old deployment template used) - gateway-service-configmap.yaml's qa route is
# lb://landlord-service, and Spring Cloud Kubernetes discovery resolves that against
# the Service's literal metadata.name.
apiVersion: v1
kind: Service
metadata:
  name: landlord-service
spec:
  selector:
    app: landlord-service
  ports:
    - port: 7073
      targetPort: 7073
