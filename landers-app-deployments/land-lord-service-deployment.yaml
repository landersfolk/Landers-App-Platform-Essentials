apiVersion: apps/v1
kind: Deployment
metadata:
  name: land-lord-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: land-lord-service
  template:
    metadata:
      labels:
        app: land-lord-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7073"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: land-lord-service
        # For GitHub Container Registry (remote):
        # image: ghcr.io/amgad-mohammad/land-lord-service:1.0.0
        # imagePullPolicy: Always
        
        # For local k3d development (current):
        image: land-lord-service:1.0.0
        imagePullPolicy: Never  # Use 'Never' for local images, 'Always' for registry images
        
        ports:
        - containerPort: 7073
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "qa"
        - name: VAULT_HOST
          value: "vault-server"
        - name: VAULT_PORT
          value: "8200"
        - name: VAULT_TOKEN
          value: "root"
      
      # Only needed when pulling from GitHub Container Registry:
      # imagePullSecrets:
      # - name: ghcr-secret