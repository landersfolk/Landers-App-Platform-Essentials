---
# ConfigMap - Basic Keycloak Settings
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
  namespace: default
data:
  KC_DB: "postgres"
  # RDS endpoint set 2026-07-23 (landers-db instance, eu-west-1).
  KC_DB_URL: "jdbc:postgresql://landers-db.c52kk2mayopg.eu-west-1.rds.amazonaws.com:5432/keycloak"
  KC_DB_USERNAME: "keycloak"
  # gateway-service (the only caller for auth — confirmed 2026-07-23: it's the OAuth2
  # client AND resource server, app clients never reach Keycloak directly) connects
  # over plain in-cluster HTTP. KC_PROXY stays "none" for that internal path — the
  # admin console below DOES sit behind the ALB, but Keycloak's hostname v2 provider
  # handles that per-hostname (see KC_HOSTNAME_ADMIN), not via a global proxy setting.
  KC_PROXY: "none"
  # Explicit strict hostname pinned to the in-cluster Service DNS name (not a public
  # domain — this is what gateway-service's issuer-uri/jwk-set-uri config expects,
  # see EC2_QA_Environment_Setup_Guide.txt Part 9.3 — stays pointed at
  # http://keycloak:8180, unchanged from the original dev/qa profile). This is
  # SEPARATE from KC_HOSTNAME_ADMIN below — changing this would break gateway-service's
  # token validation; only KC_HOSTNAME_ADMIN is meant to be public-facing.
  # MUST be a full URL once KC_HOSTNAME_ADMIN is also set (Keycloak validation:
  # "hostname must be set to a URL when hostname-admin is set") — a bare hostname
  # worked fine on its own, but not combined with hostname-admin. Value is otherwise
  # unchanged in meaning: same host:port gateway-service already calls.
  KC_HOSTNAME: "http://keycloak:8180"
  # Admin console/API only, on its own hostname (Keycloak's "hostname v2" provider
  # supports this split natively) — added 2026-07-24 purely for convenient browser
  # access to manage realms/clients/users, instead of kcadm.sh via kubectl exec every
  # time. Does NOT affect the iss claim on tokens gateway-service validates — that's
  # governed by KC_HOSTNAME above, untouched.
  # MUST be a full URL (scheme required) — a bare hostname fails with "Provided
  # hostname-admin is not a valid URL". https:// here reflects what's externally
  # visible (the ALB terminates TLS), even though the connection from ALB to this
  # pod itself is plain HTTP (KC_PROXY=none, KC_HTTP_ENABLED=true).
  KC_HOSTNAME_ADMIN: "https://keycloak-qa.landersfolk.com"
  KC_HOSTNAME_STRICT: "true"
  KC_HTTP_ENABLED: "true"
# Secret "keycloak-secret" is DELIBERATELY NOT DEFINED IN THIS FILE.
#
# It used to be here with placeholder stringData values, on the assumption that you'd
# `kubectl apply -f` this file once, then separately inject real values over it. That
# assumption was wrong in practice (discovered 2026-07-24, after real debugging pain):
# every subsequent `kubectl apply -f` of THIS file — e.g. for an unrelated ConfigMap/
# Deployment tweak — silently RESET the Secret back to the committed placeholder values,
# repeatedly clobbering the real DB/admin password and causing Keycloak to crash-loop
# with "password authentication failed" for no apparent reason (looked like a new bug
# each time; it was the same one, recurring).
#
# So: this file only ever touches the ConfigMap/Deployment/Service. Create the Secret
# ONCE, out-of-band, and never re-run this exact command as part of a routine
# `kubectl apply -f` of this file — only if the DB/admin password itself actually changes:
#   kubectl create secret generic keycloak-secret --namespace default \
#     --from-literal=KEYCLOAK_ADMIN=admin \
#     --from-literal=KEYCLOAK_ADMIN_PASSWORD='<real admin password>' \
#     --from-literal=KC_DB_PASSWORD='<the keycloak RDS user password from Part 6.1>'
# (no --dry-run=client -o yaml | kubectl apply -f - this time — plain `kubectl create`,
# specifically so a re-run of THIS file can never touch it again)
---
# Deployment — no readiness/liveness probes configured yet. Fine for QA (a crashed
# container still gets noticed via `kubectl get pods` showing CrashLoopBackOff either
# way); add probes here if this pattern is ever promoted closer to real production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: default
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.0.7
        # "start" (production mode), not "start-dev" — start-dev disables various
        # hardening/caching behaviors that are fine for a laptop but not for a QA box
        # meant to behave like production. Production mode is stricter about config
        # (e.g. requires KC_HOSTNAME to be set, which we now provide below) — if the
        # pod fails to start after this change, check `kubectl logs` first, it's
        # usually a missing required setting rather than a real problem.
        args: ["start"]
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KEYCLOAK_ADMIN
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KEYCLOAK_ADMIN_PASSWORD
        - name: KC_DB
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_DB
        - name: KC_DB_URL
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_DB_URL
        - name: KC_DB_USERNAME
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_DB_USERNAME
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KC_DB_PASSWORD
        - name: KC_PROXY
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_PROXY
        - name: KC_HOSTNAME
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_HOSTNAME
        - name: KC_HOSTNAME_ADMIN
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_HOSTNAME_ADMIN
        - name: KC_HOSTNAME_STRICT
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_HOSTNAME_STRICT
        - name: KC_HTTP_ENABLED
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_HTTP_ENABLED
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi
---
# Service — type: LoadBalancer (changed 2026-07-24), so k3s's ServiceLB binds this to
# a real host port (8180) for the ALB to reach, for admin-console access only (see
# KC_HOSTNAME_ADMIN above). App auth traffic is unaffected either way — gateway-service
# reaches this Service at http://keycloak:8180 whether it's ClusterIP or LoadBalancer,
# since LoadBalancer Services in Kubernetes remain fully reachable via ClusterIP too.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: default
  labels:
    app: keycloak
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 8180
    targetPort: 8080
  selector:
    app: keycloak
