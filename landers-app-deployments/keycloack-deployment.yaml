---
# ConfigMap - Basic Keycloak Settings
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
  namespace: default
data:
  KC_DB: "postgres"
  # RDS endpoint set 2026-07-23 (landers-db instance, eu-west-1).
  KC_DB_URL: "jdbc:postgresql://landers-db.c52kk2mayopg.eu-west-1.rds.amazonaws.com:5432/keycloak"
  KC_DB_USERNAME: "keycloak"
  # No reverse proxy sits in front of Keycloak — gateway-service (the only caller,
  # confirmed 2026-07-23: it's the OAuth2 client AND resource server, clients never
  # reach Keycloak directly) connects over plain in-cluster HTTP, no ALB/TLS involved.
  KC_PROXY: "none"
  # Explicit strict hostname pinned to the in-cluster Service DNS name (not a public
  # domain — Keycloak is ClusterIP-only, never exposed via the ALB, since only
  # gateway-service talks to it). Keeps the iss claim on issued tokens deterministic
  # and matching what gateway-service's issuer-uri/jwk-set-uri config expects
  # (see EC2_QA_Environment_Setup_Guide.txt Part 9.3 — that config stays pointed at
  # http://keycloak:8180, unchanged from the original dev/qa profile).
  KC_HOSTNAME: "keycloak"
  KC_HOSTNAME_STRICT: "true"
  KC_HTTP_ENABLED: "true"
---
# Secret - Passwords
# Deliberately NOT real values here — this file is committed to a git repo, and a real
# admin/DB password belongs there even less than the "admin123"/"keycloak123" placeholders
# this replaced. After `kubectl apply`, overwrite both with real values via a one-off
# command that never gets committed:
#   kubectl create secret generic keycloak-secret --namespace default \
#     --from-literal=KEYCLOAK_ADMIN=admin \
#     --from-literal=KEYCLOAK_ADMIN_PASSWORD='<real admin password>' \
#     --from-literal=KC_DB_PASSWORD='<the keycloak RDS user password from Part 6.1>' \
#     --dry-run=client -o yaml | kubectl apply -f -
# (that --dry-run=client -o yaml | kubectl apply -f - pattern updates the existing Secret
# in place rather than erroring that it already exists)
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: default
type: Opaque
stringData:
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "REPLACE_VIA_KUBECTL_AFTER_APPLY"
  KC_DB_PASSWORD: "REPLACE_VIA_KUBECTL_AFTER_APPLY"
---
# Deployment — no readiness/liveness probes configured yet. Fine for QA (a crashed
# container still gets noticed via `kubectl get pods` showing CrashLoopBackOff either
# way); add probes here if this pattern is ever promoted closer to real production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: default
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.0.7
        # "start" (production mode), not "start-dev" — start-dev disables various
        # hardening/caching behaviors that are fine for a laptop but not for a QA box
        # meant to behave like production. Production mode is stricter about config
        # (e.g. requires KC_HOSTNAME to be set, which we now provide below) — if the
        # pod fails to start after this change, check `kubectl logs` first, it's
        # usually a missing required setting rather than a real problem.
        args: ["start"]
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KEYCLOAK_ADMIN
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KEYCLOAK_ADMIN_PASSWORD
        - name: KC_DB
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_DB
        - name: KC_DB_URL
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_DB_URL
        - name: KC_DB_USERNAME
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_DB_USERNAME
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: KC_DB_PASSWORD
        - name: KC_PROXY
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_PROXY
        - name: KC_HOSTNAME
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_HOSTNAME
        - name: KC_HOSTNAME_STRICT
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_HOSTNAME_STRICT
        - name: KC_HTTP_ENABLED
          valueFrom:
            configMapKeyRef:
              name: keycloak-config
              key: KC_HTTP_ENABLED
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi
---
# Service — ClusterIP (default), NOT LoadBalancer. Confirmed 2026-07-23: no external
# client ever talks to Keycloak directly — gateway-service is the only caller (see
# EC2_QA_Environment_Setup_Guide.txt Part 6, top note), reaching it in-cluster at
# http://keycloak:8180. No ALB target group, no public hostname, no ACM cert
# involvement for Keycloak at all — that's specifically for gateway-service (Part 11)
# and the two Angular apps (Part 12), which DO need public routing.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: default
  labels:
    app: keycloak
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8180
    targetPort: 8080
  selector:
    app: keycloak
