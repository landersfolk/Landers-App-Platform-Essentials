apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7070"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: gateway-service
        image: gateway-service:1.0.0
        imagePullPolicy: Never
        ports:
        - containerPort: 7070
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "qa"
        - name: VAULT_HOST
          value: "vault-server"
        - name: VAULT_PORT
          value: "8200"
        - name: VAULT_TOKEN
          value: "root"