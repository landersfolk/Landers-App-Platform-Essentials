nameOverride: booking-service

image:
  repository: ghcr.io/landersfolk/booking-service
  tag: "0191967"
  pullPolicy: Always

containerPort: 7076

service:
  port: 7076

env:
  SPRING_PROFILES_ACTIVE: qa

# QA (EC2, this branch): real per-service AppRole identity, matching
# vault-production/setup-approle.sh. role_id/secret_id come from the
# booking-service-vault-creds k8s Secret (created by
# deploy/09-deploy-services.sh's Vault AppRole bootstrap step, not by
# this chart).
vault:
  enabled: true
  host: vault-prod
  port: "8200"
  scheme: http
  authMethod: APPROLE
  secretName: booking-service-vault-creds

prometheus:
  enabled: true
  path: /actuator/prometheus
