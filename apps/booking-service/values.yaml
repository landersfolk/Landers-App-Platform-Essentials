nameOverride: booking-service

image:
  repository: ghcr.io/landersfolk/booking-service
  tag: "latest"   # overwritten by CI on every push to main — see .github/workflows/ci.yml in booking-service
  pullPolicy: Always

containerPort: 7076

service:
  port: 7076

env:
  SPRING_PROFILES_ACTIVE: qa

vault:
  enabled: true
  host: vault-prod
  port: "8200"
  scheme: http
  authMethod: APPROLE
  secretName: booking-service-vault-creds

prometheus:
  enabled: true
  path: /actuator/prometheus
