nameOverride: notification-service

image:
  repository: ghcr.io/landersfolk/notification-service
  tag: "0b1ca47"
  pullPolicy: Always

containerPort: 7078

service:
  port: 7078

env:
  SPRING_PROFILES_ACTIVE: qa
  # Email sender: graph sends through Microsoft Graph (credentials from Infisical /MICROSOFT/MAIL). The service refuses to
  # start without this (the default, logging, sends nothing). Set on the QA server; see RELEASE notes.
  EMAIL_PROVIDER: graph

# Infisical replaces Vault for secrets management (see commons-cloud's
# InfisicalEnvironmentPostProcessor). secretName points at a pre-created k8s
# Secret (kubectl create secret generic infisical-credentials --from-literal=
# INFISICAL_CLIENT_ID=... --from-literal=INFISICAL_CLIENT_SECRET=...) - never
# committed here. env=staging matches this project's actual configured
# Infisical environment slug for QA.
infisical:
  enabled: true
  env: staging
  secretName: infisical-credentials

prometheus:
  enabled: true
  path: /actuator/prometheus

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Separate probes: liveness = app state only (never DB/Redis/Kafka); readiness = app state + DB.
probes:
  livenessPath: /actuator/health/liveness
  readinessPath: /actuator/health/readiness
