nameOverride: notification-service

image:
  repository: ghcr.io/landersfolk/notification-service
  tag: "52ec880"
  pullPolicy: Always

containerPort: 7078

service:
  port: 7078

env:
  SPRING_PROFILES_ACTIVE: qa

# Infisical replaces Vault for secrets management (see commons-cloud's
# InfisicalEnvironmentPostProcessor). secretName points at a pre-created k8s
# Secret (kubectl create secret generic infisical-credentials --from-literal=
# INFISICAL_CLIENT_ID=... --from-literal=INFISICAL_CLIENT_SECRET=...) - never
# committed here. env=dev matches this project's actual configured
# Infisical environment slug for local k3d.
infisical:
  enabled: true
  env: dev
  secretName: infisical-credentials

prometheus:
  enabled: true
  path: /actuator/prometheus

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
