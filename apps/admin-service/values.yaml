nameOverride: admin-service

image:
  repository: ghcr.io/landersfolk/admin-service
  tag: "2b8769b"
  pullPolicy: Always

containerPort: 7071

service:
  port: 7071

env:
  SPRING_PROFILES_ACTIVE: qa

# QA (EC2, this branch): real per-service AppRole identity, matching
# vault-production/setup-approle.sh. role_id/secret_id come from the
# admin-service-vault-creds k8s Secret (created by
# deploy/09-deploy-services.sh's Vault AppRole bootstrap step, not by
# this chart).
vault:
  enabled: true
  host: vault-prod
  port: "8200"
  scheme: http
  authMethod: APPROLE
  secretName: admin-service-vault-creds

prometheus:
  enabled: true
  path: /actuator/prometheus
