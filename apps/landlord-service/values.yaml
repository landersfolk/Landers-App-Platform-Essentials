nameOverride: landlord-service

image:
  repository: ghcr.io/landersfolk/landlord-service
  tag: "latest"   # overwritten by CI on every push to main — see .github/workflows/ci.yml in landlord-service
  pullPolicy: Always

containerPort: 7073

service:
  port: 7073

env:
  SPRING_PROFILES_ACTIVE: qa

vault:
  enabled: true
  host: vault-prod
  port: "8200"
  scheme: http
  authMethod: APPROLE
  secretName: landlord-service-vault-creds

prometheus:
  enabled: true
  path: /actuator/prometheus
