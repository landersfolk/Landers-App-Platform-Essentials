nameOverride: landlord-service

image:
  repository: ghcr.io/landersfolk/landlord-service
  tag: "be71eac"
  pullPolicy: Always

containerPort: 7073

service:
  port: 7073

env:
  SPRING_PROFILES_ACTIVE: qa

# QA (EC2, this branch): real per-service AppRole identity, matching
# vault-production/setup-approle.sh. role_id/secret_id come from the
# landlord-service-vault-creds k8s Secret (created by
# deploy/09-deploy-services.sh's Vault AppRole bootstrap step, not by
# this chart).
vault:
  enabled: true
  host: vault-prod
  port: "8200"
  scheme: http
  authMethod: APPROLE
  secretName: landlord-service-vault-creds

# Infisical is replacing Vault (see commons-cloud's InfisicalEnvironmentPostProcessor).
# Left additive alongside vault: above (harmless extra env vars for the still-running
# Vault-based image) until landlord-service's own image is rebuilt from the migrated
# source and vault.enabled can safely flip to false. secretName points at a
# pre-created k8s Secret (kubectl create secret generic infisical-credentials
# --from-literal=INFISICAL_CLIENT_ID=... --from-literal=INFISICAL_CLIENT_SECRET=...) -
# never committed here. env=staging matches this project's actual configured slug
# for QA (verified /DB and /KEYCLOAK secrets already exist there).
infisical:
  enabled: true
  env: staging
  secretName: infisical-credentials

prometheus:
  enabled: true
  path: /actuator/prometheus
