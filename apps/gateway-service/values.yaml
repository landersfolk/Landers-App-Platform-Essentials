nameOverride: gateway-service

image:
  repository: ghcr.io/landersfolk/gateway-service
  tag: "436ce4d"
  pullPolicy: Always

containerPort: 7070

service:
  type: LoadBalancer
  port: 7070

env:
  SPRING_PROFILES_ACTIVE: qa

# QA (EC2, this branch): real per-service AppRole identity, matching
# vault-production/setup-approle.sh. role_id/secret_id come from the
# gateway-service-vault-creds k8s Secret (created by
# deploy/09-deploy-services.sh's Vault AppRole bootstrap step, not by
# this chart).
vault:
  enabled: true
  host: vault-prod
  port: "8200"
  scheme: http
  authMethod: APPROLE
  secretName: gateway-service-vault-creds

prometheus:
  enabled: true
  path: /actuator/prometheus
