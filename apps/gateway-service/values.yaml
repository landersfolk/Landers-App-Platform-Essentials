nameOverride: gateway-service

image:
  repository: ghcr.io/landersfolk/gateway-service
  tag: "ba3f798"
  pullPolicy: Always

containerPort: 7070

service:
  port: 7070

env:
  SPRING_PROFILES_ACTIVE: qa

vault:
  enabled: true
  host: vault-prod
  port: "8200"
  scheme: http
  authMethod: APPROLE
  secretName: gateway-service-vault-creds

prometheus:
  enabled: true
  path: /actuator/prometheus
