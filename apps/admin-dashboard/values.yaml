nameOverride: admin-dashboard

image:
  repository: ghcr.io/landersfolk/admin-dashboard
  tag: "cd02352"
  pullPolicy: Always

containerPort: 80

service:
  type: LoadBalancer
  # Must stay 4400 (not 80) -- matches ADMIN_DASHBOARD_PORT in
  # deploy/envs/qa.env, which the ALB target group + host-port routing
  # depend on. containerPort (nginx's actual listen port) stays 80.
  port: 4400

env: {}

vault:
  enabled: false

prometheus:
  enabled: false

# nginx serving a static Angular build — far lighter than the chart's
# backend-sized default (JVM services).
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# nginx has no /actuator/health; "/" (the dashboard itself) is what's
# actually being served.
probes:
  path: /
