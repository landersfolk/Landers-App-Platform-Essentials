nameOverride: lander-web

image:
  repository: ghcr.io/landersfolk/lander-web
  tag: "a9d19b2"
  pullPolicy: Always

containerPort: 80

service:
  port: 80

env: {}

vault:
  enabled: false

prometheus:
  enabled: false

# nginx serving a static SSR/prerendered build — far lighter than the
# chart's backend-sized default (JVM services).
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# nginx has no /actuator/health; "/" (the site itself) is what's actually
# being served.
probes:
  path: /
