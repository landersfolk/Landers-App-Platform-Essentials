nameOverride: lander-web

image:
  repository: ghcr.io/landersfolk/lander-web
  tag: "e2cc8db"
  pullPolicy: Always

containerPort: 80

service:
  type: LoadBalancer
  # Must stay 4300 (not 80) -- matches WEBSITE_PORT in deploy/envs/qa.env,
  # which the ALB target group + host-port routing depend on. containerPort
  # (nginx's actual listen port) stays 80.
  port: 4300

env: {}

vault:
  enabled: false

prometheus:
  enabled: false
