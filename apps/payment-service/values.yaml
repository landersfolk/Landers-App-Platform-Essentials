nameOverride: payment-service

image:
  repository: ghcr.io/landersfolk/payment-service
  tag: "6712db9"
  pullPolicy: Always

containerPort: 7077

service:
  port: 7077

env:
  SPRING_PROFILES_ACTIVE: qa

# dev cluster (k3d-landers-app): TOKEN auth with the shared root token,
# matching every service's own application.yml default and
# vault-seed-secrets.sh. QA/prod overrides this to authMethod: APPROLE +
# secretName: payment-service-vault-creds (see vault-production/setup-approle.sh).
vault:
  enabled: true
  host: vault-server
  port: "8200"
  scheme: http
  authMethod: TOKEN
  token: root

prometheus:
  enabled: true
  path: /actuator/prometheus

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
