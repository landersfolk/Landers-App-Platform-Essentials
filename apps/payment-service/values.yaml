nameOverride: payment-service

image:
  repository: ghcr.io/landersfolk/payment-service
  tag: "5211d4f"
  pullPolicy: Always

containerPort: 7077

service:
  port: 7077

env:
  SPRING_PROFILES_ACTIVE: qa
  # XPay card checkout for non-EGP bookings (payment-service). Needs the four /XPAY secrets in Infisical (staging); startup fails naming any that is missing.
  PAYMENTS_XPAY_ENABLED: "true"
  # Where XPay sends the customer back after a redirect step (3-D Secure). XPay refuses a session without it, so it is set explicitly
  # instead of being derived from the request host.
  PAYMENTS_XPAY_RETURN_URL: "https://qa-api.landersfolk.com/api/v1/payments/xpay/checkout"
  # Multi-currency wallets (charge / withdraw / convert, a wallet per currency, settle by booking currency). Off when absent.
  PAYMENTS_MULTI_CURRENCY_ENABLED: "true"
  # Card checkout in a converted currency (quote then confirm). Rate lock in seconds, spread in percent added to the converted
  # amount, and the smallest charge each gateway accepts (PLACEHOLDERS: set the real Paymob / XPay minimums).
  PAYMENTS_GATEWAY_CONVERSION_QUOTE_TTL_SECONDS: "60"
  PAYMENTS_GATEWAY_CONVERSION_SPREAD_PERCENT: "0"
  PAYMENTS_GATEWAY_CONVERSION_MIN_CHARGE_EGP: "1"
  PAYMENTS_GATEWAY_CONVERSION_MIN_CHARGE_XPAY: "0.5"

# Infisical replaces Vault for secrets management (see commons-cloud's
# InfisicalEnvironmentPostProcessor). secretName points at a pre-created k8s
# Secret (kubectl create secret generic infisical-credentials --from-literal=
# INFISICAL_CLIENT_ID=... --from-literal=INFISICAL_CLIENT_SECRET=...) - never
# committed here. env=staging matches this project's actual configured
# Infisical environment slug for QA.
infisical:
  enabled: true
  env: staging
  secretName: infisical-credentials

prometheus:
  enabled: true
  path: /actuator/prometheus

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Separate probes: liveness = app state only (never DB/Redis/Kafka); readiness = app state + DB.
probes:
  livenessPath: /actuator/health/liveness
  readinessPath: /actuator/health/readiness
