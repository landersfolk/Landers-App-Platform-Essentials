nameOverride: user-service

image:
  repository: ghcr.io/landersfolk/user-service
  tag: "a02fc49"
  pullPolicy: Always

containerPort: 7075

service:
  port: 7075

env:
  SPRING_PROFILES_ACTIVE: qa

# QA (EC2, this branch): real per-service AppRole identity, matching
# vault-production/setup-approle.sh. role_id/secret_id come from the
# user-service-vault-creds k8s Secret (created by
# deploy/09-deploy-services.sh's Vault AppRole bootstrap step, not by
# this chart).
vault:
  enabled: true
  host: vault-prod
  port: "8200"
  scheme: http
  authMethod: APPROLE
  secretName: user-service-vault-creds

prometheus:
  enabled: true
  path: /actuator/prometheus
