nameOverride: user-service

image:
  repository: ghcr.io/landersfolk/user-service
  tag: "ad49690"
  pullPolicy: Always

containerPort: 7075

service:
  port: 7075

env:
  SPRING_PROFILES_ACTIVE: qa

# Disabled 2026-08-07: Infisical migration verified healthy for all 9 services,
# both local k3d and QA. Left in place (not deleted) purely for an easy rollback
# if ever needed - matches every service's own application.yml default and
# vault-seed-secrets.sh. QA/prod used authMethod: APPROLE + secretName:
# user-service-vault-creds instead (see vault-production/setup-approle.sh).
vault:
  enabled: false
  host: vault-server
  port: "8200"
  scheme: http
  authMethod: TOKEN
  token: root

# Infisical replaced Vault (see commons-cloud's InfisicalEnvironmentPostProcessor) -
# vault.enabled flipped to false above once every service was confirmed migrated
# and healthy. secretName points at a pre-created k8s Secret (kubectl create secret
# generic infisical-credentials --from-literal=INFISICAL_CLIENT_ID=...
# --from-literal=INFISICAL_CLIENT_SECRET=...) - never committed here. env=dev
# matches this project's actual configured slug.
infisical:
  enabled: true
  env: dev
  secretName: infisical-credentials

prometheus:
  enabled: true
  path: /actuator/prometheus

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
