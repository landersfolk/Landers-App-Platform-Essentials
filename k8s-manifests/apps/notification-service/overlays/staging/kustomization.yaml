# staging overlay — NOT wired to an ArgoCD Application yet (that's Step 8, only
# after the dev pilot in overlays/dev is confirmed working). Included now only to
# match the target directory layout.
#
# Note on profile naming: this project's Spring config only has dev/qa/prod
# profiles (see landers-app-config-maps) — "staging" here maps to the "qa"
# Spring profile, since that's this codebase's pre-prod environment.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: notification-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "qa"
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "200m"
            memory: "384Mi"
          limits:
            cpu: "750m"
            memory: "768Mi"

images:
  - name: jfrog-artifactory:8082/docker-local/notification-service
    newTag: IMAGE_TAG_PLACEHOLDER
